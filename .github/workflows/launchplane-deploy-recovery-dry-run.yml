---
name: Launchplane Deploy Recovery Dry Run

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Launchplane product identifier.
        required: true
        type: string
      instance:
        description: Launchplane product instance.
        required: true
        type: string
      artifact_id:
        description: Exact original immutable artifact identifier.
        required: true
        type: string
      source_git_ref:
        description: Exact original source commit.
        required: true
        type: string
      idempotency_key:
        description: Exact original deploy Idempotency-Key.
        required: true
        type: string
      reason:
        description: Operator reason for the read-only recovery inspection.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: launchplane-deploy-recovery-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Inspect existing deploy reservation
    runs-on: ubuntu-latest
    steps:
      - name: Build exact original deploy payload
        id: payload
        env:
          PRODUCT: ${{ inputs.product }}
          INSTANCE: ${{ inputs.instance }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          payload="$(jq -cn \
            --arg product "$PRODUCT" \
            --arg instance "$INSTANCE" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg source_git_ref "$SOURCE_GIT_REF" \
            --arg reason "$REASON" \
            '{
              schema_version: 1,
              product: $product,
              instance: $instance,
              original_deploy: {
                schema_version: 1,
                product: $product,
                deploy: {
                  schema_version: 1,
                  product: $product,
                  instance: $instance,
                  artifact_id: $artifact_id,
                  source_git_ref: $source_git_ref
                }
              },
              reason: $reason
            }')"

          {
            echo "payload<<EOF"
            echo "$payload"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Request Launchplane recovery dry run
        id: recovery
        uses: cbusillo/launchplane/.github/actions/launchplane-request@09d73fd7c8ffd26ec886ac61881dbed25f386509
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          route-path: /v1/admin/generic-web/deploy-recovery/dry-run
          payload: ${{ steps.payload.outputs.payload }}
          idempotency-key: ${{ inputs.idempotency_key }}
          timeout-ms: "120000"
          log-response-body: "false"
          output-paths: >-
            recovery_digest=recovery_digest,
            proposed_action=proposed_action,
            reservation_state=reservation_state,
            provider_outcome=provider_outcome,
            provider_status=provider_status,
            retry_safe=retry_safe,
            observed_at=observed_at

      - name: Report bounded recovery evidence
        env:
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.recovery_digest }}
          PROPOSED_ACTION: ${{ steps.recovery.outputs.proposed_action }}
          RESERVATION_STATE: ${{ steps.recovery.outputs.reservation_state }}
          PROVIDER_OUTCOME: ${{ steps.recovery.outputs.provider_outcome }}
          PROVIDER_STATUS: ${{ steps.recovery.outputs.provider_status }}
          RETRY_SAFE: ${{ steps.recovery.outputs.retry_safe }}
          OBSERVED_AT: ${{ steps.recovery.outputs.observed_at }}
        run: |
          set -euo pipefail

          {
            echo "## Generic-web deploy recovery dry run"
            echo
            echo "- Recovery digest: \`$RECOVERY_DIGEST\`"
            echo "- Proposed action: \`$PROPOSED_ACTION\`"
            echo "- Reservation state: \`$RESERVATION_STATE\`"
            echo "- Provider outcome: \`$PROVIDER_OUTCOME\`"
            echo "- Provider status: \`$PROVIDER_STATUS\`"
            echo "- Retry safe: \`$RETRY_SAFE\`"
            echo "- Observed at: \`$OBSERVED_AT\`"
          } >> "$GITHUB_STEP_SUMMARY"
