---
name: Launchplane Deploy

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Launchplane product identifier for recovery inspection.
        required: true
        type: string
      instance:
        description: Launchplane product instance for recovery inspection.
        required: true
        type: string
      artifact_id:
        description: Exact original immutable artifact identifier.
        required: true
        type: string
      source_git_ref:
        description: Exact original source commit.
        required: true
        type: string
      original_run_id:
        description: GitHub Actions run ID from the exact original deploy.
        required: true
        type: string
      original_run_attempt:
        description: GitHub Actions run attempt from the exact original deploy.
        required: true
        type: string
      reason:
        description: Operator reason for the read-only recovery inspection.
        required: true
        type: string
  workflow_run:
    workflows:
      - Test Suite
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: launchplane-deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    name: Build tested sync image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    outputs:
      artifact_id: ${{ steps.launchplane_artifact.outputs.artifact_id }}
      source_git_ref: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: image_metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for name in GITHUB_REPOSITORY TESTED_SHA; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${TESTED_SHA}"

          {
            echo "image_repository=${image_repository}"
            echo "image_tag=${image_tag}"
            echo "image_reference=${image_repository}:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish sync image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sync
          push: true
          tags: ${{ steps.image_metadata.outputs.image_reference }}

      - name: Resolve Launchplane artifact identity
        id: launchplane_artifact
        env:
          IMAGE_REPOSITORY: ${{ steps.image_metadata.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail

          for name in IMAGE_REPOSITORY IMAGE_DIGEST; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          artifact_id="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Request Launchplane deploy
    needs: build-image
    if: >-
      github.event_name == 'workflow_run' &&
      needs.build-image.result == 'success'
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-stable-deploy.yml@main
    with:
      launchplane_url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      product: ${{ vars.LAUNCHPLANE_PRODUCT }}
      instance: ${{ vars.LAUNCHPLANE_INSTANCE }}
      artifact_id: ${{ needs.build-image.outputs.artifact_id }}
      source_git_ref: ${{ needs.build-image.outputs.source_git_ref }}
      timeout-ms: "720000"

  recovery-dry-run:
    name: Inspect existing deploy reservation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-stable-deploy.yml@main
    with:
      launchplane_url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      product: ${{ inputs.product }}
      instance: ${{ inputs.instance }}
      artifact_id: ${{ inputs.artifact_id }}
      source_git_ref: ${{ inputs.source_git_ref }}
      timeout-ms: "120000"
