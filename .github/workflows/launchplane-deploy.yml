---
name: Launchplane Deploy

"on":
  workflow_run:
    workflows:
      - Test Suite
      - Launchplane Recovery Request
      - Launchplane Recovery Apply Request
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: launchplane-deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    name: Build tested sync image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Test Suite' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: image_metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for name in GITHUB_REPOSITORY TESTED_SHA; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${TESTED_SHA}"

          {
            echo "image_repository=${image_repository}"
            echo "image_tag=${image_tag}"
            echo "image_reference=${image_repository}:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish sync image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sync
          push: true
          tags: ${{ steps.image_metadata.outputs.image_reference }}

      - name: Resolve Launchplane artifact identity
        id: launchplane_artifact
        env:
          IMAGE_REPOSITORY: ${{ steps.image_metadata.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail

          for name in IMAGE_REPOSITORY IMAGE_DIGEST; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          artifact_id="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "Published \`${artifact_id}\`" >> "$GITHUB_STEP_SUMMARY"

  # A merge publishes the tested image and deploys nothing. Production changes
  # only through a Launchplane promotion requested in Launchplane, never from
  # this repository.

  recovery-dry-run:
    name: Inspect existing deploy reservation
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Launchplane Recovery Request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-stable-deploy.yml@main
    with:
      artifact_id: staged-recovery-request
      source_git_ref: ${{ github.event.workflow_run.head_sha }}
      timeout-ms: "120000"

  recovery-apply:
    name: Apply approved deploy recovery
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Launchplane Recovery Apply Request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Apply digest-bound recovery
        uses: cbusillo/launchplane/.github/actions/generic-web-deploy-recovery-dry-run@f416291eec1038090afbbc00c4c61e628f39a33c
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          expected-product: ${{ vars.LAUNCHPLANE_PRODUCT }}
          expected-instance: ${{ vars.LAUNCHPLANE_INSTANCE }}
          workflow-run-id: ${{ github.event.workflow_run.id }}
          timeout-ms: "120000"
