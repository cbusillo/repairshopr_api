---
name: Launchplane Deploy

"on":
  workflow_run:
    workflows:
      - Test Suite
      - Launchplane Recovery Request
      - Launchplane Recovery Apply Request
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: launchplane-deploy-main
  cancel-in-progress: false

jobs:
  build-image:
    name: Build tested sync image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Test Suite' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    outputs:
      artifact_id: ${{ steps.launchplane_artifact.outputs.artifact_id }}
      source_git_ref: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: image_metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for name in GITHUB_REPOSITORY TESTED_SHA; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${TESTED_SHA}"

          {
            echo "image_repository=${image_repository}"
            echo "image_tag=${image_tag}"
            echo "image_reference=${image_repository}:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish sync image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sync
          push: true
          tags: ${{ steps.image_metadata.outputs.image_reference }}

      - name: Resolve Launchplane artifact identity
        id: launchplane_artifact
        env:
          IMAGE_REPOSITORY: ${{ steps.image_metadata.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail

          for name in IMAGE_REPOSITORY IMAGE_DIGEST; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required environment value: ${name}" >&2
              exit 1
            fi
          done

          artifact_id="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Request Launchplane deploy
    needs: build-image
    if: >-
      github.event_name == 'workflow_run' &&
      needs.build-image.result == 'success'
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-stable-deploy.yml@main
    with:
      launchplane_url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      product: ${{ vars.LAUNCHPLANE_PRODUCT }}
      instance: ${{ vars.LAUNCHPLANE_INSTANCE }}
      artifact_id: ${{ needs.build-image.outputs.artifact_id }}
      source_git_ref: ${{ needs.build-image.outputs.source_git_ref }}
      timeout-ms: "720000"

  recovery-dry-run:
    name: Inspect existing deploy reservation
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Launchplane Recovery Request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-stable-deploy.yml@main
    with:
      artifact_id: staged-recovery-request
      source_git_ref: ${{ github.event.workflow_run.head_sha }}
      timeout-ms: "120000"

  recovery-apply:
    name: Apply approved deploy recovery
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Launchplane Recovery Apply Request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download staged recovery apply request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launchplane-recovery-apply-request-${{ github.event.workflow_run.id }}
          path: .launchplane-recovery-apply
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve and validate approved recovery apply
        id: request
        env:
          CONFIGURED_INSTANCE: ${{ vars.LAUNCHPLANE_INSTANCE }}
          CONFIGURED_PRODUCT: ${{ vars.LAUNCHPLANE_PRODUCT }}
        run: |
          set -euo pipefail

          request_file=.launchplane-recovery-apply/launchplane-recovery-apply-request.json
          if [ ! -f "$request_file" ] || [ -L "$request_file" ]; then
            echo "Recovery apply artifact is missing or invalid." >&2
            exit 1
          fi
          if [ "$(find .launchplane-recovery-apply -type f | wc -l | tr -d ' ')" != "1" ]; then
            echo "Recovery apply artifact must contain exactly one file." >&2
            exit 1
          fi
          if [ "$(wc -c < "$request_file" | tr -d ' ')" -gt 8192 ]; then
            echo "Recovery apply artifact exceeds the size limit." >&2
            exit 1
          fi
          if [ -z "$CONFIGURED_PRODUCT" ] || [ -z "$CONFIGURED_INSTANCE" ]; then
            echo "Launchplane product and instance variables are required." >&2
            exit 1
          fi

          expected_keys='["artifact_id","expected_recovery_digest","instance","original_run_attempt","original_run_id","product","reason","schema_version","source_git_ref"]'
          if ! jq -e --argjson expected_keys "$expected_keys" \
            '(.schema_version == 1) and ((keys | sort) == $expected_keys)' \
            "$request_file" >/dev/null; then
            echo "Recovery apply artifact has an invalid schema." >&2
            exit 1
          fi

          product="$(jq -er '.product | select(type == "string")' "$request_file")"
          instance="$(jq -er '.instance | select(type == "string")' "$request_file")"
          artifact_id="$(jq -er '.artifact_id | select(type == "string")' "$request_file")"
          source_git_ref="$(jq -er '.source_git_ref | select(type == "string")' "$request_file")"
          original_run_id="$(jq -er '.original_run_id | select(type == "string")' "$request_file")"
          original_run_attempt="$(jq -er '.original_run_attempt | select(type == "string")' "$request_file")"
          recovery_digest="$(jq -er '.expected_recovery_digest | select(type == "string")' "$request_file")"
          reason="$(jq -er '.reason | select(type == "string")' "$request_file")"

          if [ "$product" != "$CONFIGURED_PRODUCT" ] || [ "$instance" != "$CONFIGURED_INSTANCE" ]; then
            echo "Recovery apply target does not match repository configuration." >&2
            exit 1
          fi
          if [[ ! "$artifact_id" =~ ^ghcr\.io/cbusillo/repairshopr_api@sha256:[0-9a-f]{64}$ ]]; then
            echo "Recovery apply artifact identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$source_git_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Recovery apply source commit is invalid." >&2
            exit 1
          fi
          if [[ ! "$original_run_id" =~ ^[1-9][0-9]*$ ]] || \
            [[ ! "$original_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "Recovery apply original run identity is invalid." >&2
            exit 1
          fi
          if [[ ! "$recovery_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Recovery apply digest is invalid." >&2
            exit 1
          fi
          if [ -z "$reason" ] || [ "${#reason}" -gt 1000 ]; then
            echo "Recovery apply reason is invalid." >&2
            exit 1
          fi

          mkdir -p .launchplane-recovery-payload
          jq -cn \
            --arg product "$product" \
            --arg instance "$instance" \
            --arg artifact_id "$artifact_id" \
            --arg source_git_ref "$source_git_ref" \
            --arg reason "$reason" \
            --arg expected_recovery_digest "$recovery_digest" \
            '{
              schema_version: 1,
              product: $product,
              instance: $instance,
              original_deploy: {
                schema_version: 1,
                product: $product,
                deploy: {
                  schema_version: 1,
                  product: $product,
                  instance: $instance,
                  artifact_id: $artifact_id,
                  source_git_ref: $source_git_ref
                }
              },
              reason: $reason,
              expected_recovery_digest: $expected_recovery_digest
            }' > .launchplane-recovery-payload/request.json

          {
            echo "idempotency_key=generic-web-stable-deploy:${product}:${instance}:${original_run_id}:${original_run_attempt}"
            echo "recovery_digest=${recovery_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply digest-bound recovery adoption
        uses: cbusillo/launchplane/.github/actions/launchplane-request@90489f6d017f6183a586144f5327cd5ec671d7a4
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          route-path: /v1/admin/generic-web/deploy-recovery/apply
          payload-file: .launchplane-recovery-payload/request.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: "120000"
          retry-attempts: "3"
          expected-status: "202"
          response-output-file: .launchplane-recovery-payload/response.json
          log-response-body: "false"

      - name: Verify adoption-only recovery result
        env:
          EXPECTED_RECOVERY_DIGEST: ${{ steps.request.outputs.recovery_digest }}
        run: |
          set -euo pipefail

          response_file=.launchplane-recovery-payload/response.json
          if [ ! -f "$response_file" ] || [ -L "$response_file" ]; then
            echo "Recovery apply response is missing or invalid." >&2
            exit 1
          fi
          if ! jq -e --arg digest "$EXPECTED_RECOVERY_DIGEST" '
            .schema_version == 1 and
            .status == "accepted" and
            .mode == "apply" and
            .reservation_state == "completed" and
            .recovery_action == "adopt_observed" and
            .recovery_digest == $digest and
            .provider_outcome == "present" and
            .provider_status == "done" and
            .retry_safe == false and
            (.reservation_attempt | type == "number" and . >= 1) and
            (.trace_id | type == "string" and length > 0)
          ' "$response_file" >/dev/null; then
            echo "Recovery apply response did not prove the approved adoption." >&2
            exit 1
          fi

          {
            echo "## Launchplane Recovery Apply"
            echo
            echo "- Reservation state: completed"
            echo "- Recovery action: adopt_observed"
            echo "- Provider outcome: present"
            echo "- Provider status: done"
            echo "- Retry safe: false"
            echo "- Recovery digest: ${EXPECTED_RECOVERY_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
