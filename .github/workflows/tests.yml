---
name: Test Suite

"on":
  pull_request:
  # On main, Build runs this suite before it publishes the image.
  workflow_call:

permissions:
  contents: read

jobs:
  launchplane-config-authority:
    uses: cbusillo/launchplane/.github/workflows/reusable-product-repo-config-authority.yml@591329bff68f73232cc0ecb7846246b36f1e17cf
    with:
      launchplane-revision: 591329bff68f73232cc0ecb7846246b36f1e17cf

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify lockfile is in sync
        run: ./scripts/check-lockfile.sh

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage gate
        run: uv run pytest -q

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKER_IMAGE_REFERENCE: ci-unused
      MARIADB_CONTAINER: mariadb-${{ github.run_id }}-${{ github.run_attempt }}
      MARIADB_HOST: 127.0.0.1
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: repairshopr_test
      MARIADB_USER: repairshopr_api
      MARIADB_PASSWORD: root
      MARIADB_ROOT_PASSWORD: root

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # A testing lane on the production Docker host must never mount the
      # production database or config volumes, or take its host ports.
      - name: Require compose state to be separable per lane
        run: |
          render() {
            docker compose -f addons/repairshopr-sync/compose.yml \
              config --format json 2>/dev/null |
              jq -c '{
                volumes: [.volumes[].name] | sort,
                ports: [.services[].ports[]?.published] | sort
              }'
          }
          production="$(render)"
          testing="$(
            SYNC_CONFIG_VOLUME_NAME=lane_check_config \
            SYNC_DB_VOLUME_NAME=lane_check_mysql \
            SYNC_DB_HOST_PORT=13307 \
            SYNC_HEALTH_HOST_PORT=18000 \
            render
          )"
          shared="$(
            jq -n --argjson a "$production" --argjson b "$testing" \
              '[($a.volumes - ($a.volumes - $b.volumes))[],
                ($a.ports - ($a.ports - $b.ports))[]]'
          )"
          if [ "$shared" != "[]" ]; then
            echo "A second lane would share production state: $shared" >&2
            exit 1
          fi

      - name: Start MariaDB from production compose
        run: |
          image="$(
            docker compose -f addons/repairshopr-sync/compose.yml \
              config --format json | jq -er '.services.db.image'
          )"
          case "$image" in
            mariadb:* | mariadb@* | */mariadb:* | */mariadb@*) ;;
            *)
              echo "Unexpected database image: $image" >&2
              exit 1
              ;;
          esac
          docker run --detach --name "$MARIADB_CONTAINER" \
            --env MARIADB_ROOT_PASSWORD \
            --env MARIADB_DATABASE \
            --env MARIADB_USER \
            --env MARIADB_PASSWORD \
            --publish "$MARIADB_PORT:3306" \
            "$image"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify lockfile is in sync
        run: ./scripts/check-lockfile.sh

      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies (sync extras)
        run: uv sync --locked --group dev --extra sync

      - name: Wait for MariaDB
        run: |
          if ! uv run python - <<'PY'
          import os
          import time
          import MySQLdb

          for attempt in range(60):
              try:
                  MySQLdb.connect(
                      host=os.environ["MARIADB_HOST"],
                      port=int(os.environ["MARIADB_PORT"]),
                      user=os.environ["MARIADB_USER"],
                      passwd=os.environ["MARIADB_PASSWORD"],
                      db=os.environ["MARIADB_DATABASE"],
                  ).close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MariaDB service did not become ready")
          PY
          then
            docker logs "$MARIADB_CONTAINER"
            exit 1
          fi

      - name: Run MariaDB integration tests
        env:
          RUN_MARIADB_INTEGRATION: "1"
        run: |
          uv run python -m django migrate --noinput \
            --settings=tests.django_settings_mariadb
          uv run python -m django makemigrations --check --dry-run \
            --settings=tests.django_settings_mariadb
          uv run pytest -q -m integration \
            --ds=tests.django_settings_mariadb \
            --no-cov

      - name: Show MariaDB logs on failure
        if: failure()
        run: docker logs "$MARIADB_CONTAINER"

      - name: Stop MariaDB
        if: always()
        run: docker rm --force "$MARIADB_CONTAINER" || true
